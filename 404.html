<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found · Plan India</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #fbf7f1; --ink: #1d1a17; --ink-2: #6b625a; --accent: #d9622b; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15130f; --ink: #f4efe8; --ink-2: #b2a99f; --card: #201d18; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; }
  main { max-width: 520px; text-align: center; }
  .stamp { display: inline-block; font-size: 3rem; margin-bottom: 8px; animation: tilt 2.4s ease-in-out infinite alternate; }
  @keyframes tilt { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 10px; }
  h1 em { color: var(--accent); }
  p { color: var(--ink-2); line-height: 1.6; margin: 0 0 22px; }
  a.btn { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
  a.btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<main>
  <span class="stamp">🛂</span>
  <h1>Wrong gate, <em>right airport.</em></h1>
  <p>This page doesn’t exist, but the whole of India is one click away.</p>
  <a class="btn" href="/">Back to the pictures →</a>
</main>
</body>
</html>
